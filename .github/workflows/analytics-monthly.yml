name: 월별 방문 기록

on:
  schedule:
    # 매일 15:05 UTC = 00:05 KST. 아래 guard 에서 KST 1일인 날만 진행 → 지난달 집계
    - cron: "5 15 28-31 * *"
  workflow_dispatch:
    inputs:
      month:
        description: "기록할 달 (YYYY-MM). 비우면 지난달"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    steps:
      - name: KST 1일인지 확인 (스케줄 실행만)
        id: guard
        run: |
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(TZ=Asia/Seoul date +%d)" != "01" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "오늘은 KST 1일이 아니라 건너뜀"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v5
        if: steps.guard.outputs.run == 'true'

      - name: Vercel 수치 읽어 기록
        if: steps.guard.outputs.run == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: bash scripts/record-analytics.sh "${{ github.event.inputs.month }}"

      - name: 커밋·푸시
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add analytics-log.md
          git diff --cached --quiet && { echo "변경 없음"; exit 0; }
          git commit -m "chore: 월별 방문 기록 자동 추가"
          git push
